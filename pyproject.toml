[project]
name = "hybrid-secure-cloud"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-storages>=1.14.6",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pycryptodome>=4.1.0",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.4",
    "qrcode>=8",
    "whitenoise>=6.12.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["accounts", "vault", "config", "crypto", "tests"]
exclude = ["**/migrations"]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]
