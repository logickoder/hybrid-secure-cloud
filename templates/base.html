{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hybrid Secure Cloud Storage{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'vault:dashboard' %}">Hybrid Secure Cloud Storage</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <span class="muted">{{ user.username }}</span>
        <button class="link" type="submit">Sign out</button>
      </form>
    {% endif %}
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% for message in messages %}
      <p class="notice notice-{{ message.tags }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
